<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração | Priscila Borges</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <main class="pagina admin-pagina">

        <header class="cabecalho">

            <div class="marca">

                <span class="marca-legenda">
                    PRISCILA BORGES
                </span>

                <span class="marca-titulo">
                    Administração
                </span>

            </div>

            <h1>Questionários recebidos</h1>

        </header>


        <!-- LOGIN -->

        <section id="login-area" class="admin-conteudo">

            <h2>Acesso administrativo</h2>

            <form id="login-form">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        required
                    >

                </div>


                <button type="submit" id="botao-login">
                    Entrar
                </button>

                <p id="login-status"></p>

            </form>

        </section>


        <!-- PAINEL -->

        <section id="painel-area" class="admin-conteudo" hidden>

            <div class="admin-topo">

                <h2>Questionários</h2>

                <button id="botao-sair">
                    Sair
                </button>

            </div>

            <p id="admin-status"></p>

            <div id="lista-questionarios"></div>

            <section id="detalhes-questionario" hidden>

                <button id="voltar-lista">
                    ← Voltar
                </button>

                <div id="conteudo-detalhes"></div>

            </section>

        </section>

    </main>


    <script src="js/config.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
